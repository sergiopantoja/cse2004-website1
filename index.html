<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charting some class data</title>
</head>
<body>
  <div>
    <h1>How comfortable are you with the terminal / command line?</h1>
    <canvas id="myChart"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const context = document.querySelector('#myChart')

    new Chart(context, {
      type: 'pie',
      data: {
        labels: ['Not at all', 'Somewhat familiar', 'Very comfortable'],
        datasets: [{
          label: '# of Votes',
          data: [20, 27, 6],
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    })
  </script>
</body>
</html>
